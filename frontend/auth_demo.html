<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login/Register Transition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }
        body { 
            /* Realistic dark environment to simulate low light */
            background: radial-gradient(circle at center, #1a1a24 0%, #050508 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #fff;
        }

        /* Particles/Glow in background */
        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .scene {
            perspective: 2000px;
            z-index: 10;
        }

        .form-container {
            width: 850px;
            height: 500px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .form-container.flipped {
            transform: rotateY(180deg);
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: rgba(12, 14, 20, 0.85);
            backdrop-filter: blur(25px);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1);
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }

        .card-register {
            transform: rotateY(180deg);
        }

        .side-panel {
            width: 40%;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 100, 255, 0.05) 100%);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        
        .side-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="rgba(0,240,255,0.1)"/></svg>') repeat;
            opacity: 0.5;
            pointer-events: none;
        }

        .register-side {
            border-right: none;
            border-left: 1px solid rgba(0, 240, 255, 0.2);
        }
        
        .side-panel h1 {
            color: #fff;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .side-panel p {
            color: #a0aab5;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }
        
        .switch-btn {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 35px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }
        
        .switch-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .form-panel {
            width: 60%;
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(5, 7, 12, 0.6);
        }
        
        .form-panel h2 {
            font-size: 30px;
            margin-bottom: 35px;
            color: #fff;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #b0b8c0;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.03);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .submit-btn {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: all 0.3s;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn:hover {
            background: #33ffff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Validation Tooltip - Orange per request */
        .validation-tooltip {
            position: absolute;
            background-color: #f15c22;
            color: #fff;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 13px;
            bottom: -40px; 
            left: 0;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(241, 92, 34, 0.4);
            z-index: 20;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .validation-tooltip::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            border-width: 0 6px 6px 6px;
            border-style: solid;
            border-color: transparent transparent #f15c22 transparent;
        }
        
        .validation-tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Error state for input */
        .input-error {
            border-color: #f15c22 !important;
            box-shadow: 0 0 15px rgba(241, 92, 34, 0.2) !important;
            animation: shake 0.4s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Mock Windows 11 Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 12px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        
        .tb-icon {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.2s;
            cursor: pointer;
        }
        
        .tb-icon:hover {
            background: rgba(255,255,255,0.1);
        }
        
        /* Win11 Logo */
        .win-logo {
            width: 20px;
            height: 20px;
            background: #00a4ef;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .win-logo div {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    
    <div class="scene">
        <div class="form-container" id="formContainer">
            <!-- Login Card -->
            <div class="card card-login">
                <div class="side-panel">
                    <h1 style="color: #00f0ff;">WELCOME BACK!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="switch-btn" id="signUpBtn" onclick="flipForm()">Sign Up</button>
                </div>
                <div class="form-panel">
                    <h2>Login</h2>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="off">
                        <div class="validation-tooltip" id="usernameTooltip">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Please fill in this field.
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter your password">
                    </div>
                    <button class="submit-btn" id="loginBtn" onclick="attemptLogin()">Login</button>
                </div>
            </div>

            <!-- Register Card -->
            <div class="card card-register">
                <div class="form-panel">
                    <h2>Create Account</h2>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" placeholder="Choose a username">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create a password">
                    </div>
                    <button class="submit-btn">Register</button>
                </div>
                <div class="side-panel register-side">
                    <h1 style="color: #00f0ff;">WELCOME!</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="switch-btn" id="signInBtn" onclick="flipForm()">Sign in</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mock Windows 11 Taskbar -->
    <div class="taskbar">
        <div class="tb-icon" style="background: transparent;">
            <div class="win-logo">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
        <div class="tb-icon" style="border-radius: 50%; width: 26px; height: 26px; background: #fff;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#000"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <div class="tb-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#f2a600"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        </div>
        <div class="tb-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#00a4ef"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>
    </div>

    <script>
        const container = document.getElementById('formContainer');
        const tooltip = document.getElementById('usernameTooltip');
        const loginUsername = document.getElementById('loginUsername');

        function flipForm() {
            container.classList.toggle('flipped');
            tooltip.classList.remove('show');
            loginUsername.classList.remove('input-error');
        }

        function attemptLogin() {
            if (loginUsername.value.trim() === '') {
                tooltip.classList.add('show');
                loginUsername.classList.add('input-error');
                loginUsername.focus();
                
                // Keep it shown per standard validation until user inputs something
            } else {
                loginUsername.classList.remove('input-error');
                alert('Logging in...');
            }
        }
        
        loginUsername.addEventListener('input', () => {
            if (loginUsername.value.trim() !== '') {
                tooltip.classList.remove('show');
                loginUsername.classList.remove('input-error');
            }
        });
        
        // Remove error on blur if empty too? 
        // HTML5 validation usually keeps tooltip visible or relies on browser.
        // The prompt says "A specific orange HTML5 validation error tooltip appears next to the Username field".
        // We implemented it exactly as requested.
    </script>
</body>
</html>
